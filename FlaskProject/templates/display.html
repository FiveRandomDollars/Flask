<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>FILLER</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      cursor: crosshair !important;
    }

    body {
      margin: 0;
      min-height: 180vh;
      font-family: "Comic Sans MS", cursive;
      background: #ff00ff;
      color: #00ff00;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 37px,
          rgba(255,255,0,.35) 38px 40px
        );
      z-index: 9999;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      min-height: 110px;
      background: #ffff00 !important;
      border: 14px ridge #0000ff;
      transform: rotate(-1deg);
    }

    .navbar-brand {
      color: #ff0000 !important;
      font-size: 2.5rem;
      text-decoration: underline overline;
      transform: rotate(4deg);
    }

    .nav-link {
      color: #0000ff !important;
      font-size: 1.3rem;
      margin: 5px 20px;
      border: 4px solid #ff0000;
      background: #00ffff;
    }

    .hero {
      margin-top: 70px;
      margin-bottom: 130px !important;
      padding: 80px 20px !important;
      background: #00ff00;
      border: 20px double #ff6600;
      box-shadow:
        30px 30px #0000ff,
        -30px -30px #ffff00;
      transform: rotate(2deg);
    }

    .hero h1 {
      font-size: clamp(3rem, 10vw, 9rem);
      color: #ff0000;
      text-shadow:
        8px 8px #0000ff,
        -8px -8px #ffff00;
      letter-spacing: -8px;
    }

    .hero p {
      background: #800080;
      color: #00ff00;
      padding: 25px;
      transform: skewX(-15deg);
    }

    .card {
      border: 15px outset #ff0000 !important;
      border-radius: 0 !important;
      background: #ffff00 !important;
      box-shadow:
        20px 20px #0000ff,
        -10px -10px #00ffff;
    }

    .card:nth-child(odd) {
      transform: rotate(-3deg);
    }

    .card-header {
      background: #800080 !important;
      color: #ffff00 !important;
      border-bottom: 12px dotted #00ff00 !important;
      padding: 30px !important;
    }

    .card-header h2 {
      font-size: 2.5rem;
      transform: rotate(3deg);
    }

    .card-body {
      padding: 40px !important;
    }

    .form-label {
      display: block;
      width: 60%;
      margin-left: 20%;
      transform: rotate(-5deg);
      color: #0000ff;
      border: 6px dashed #ff0000;
    }

    .form-select {
      height: 75px;
      border: 12px groove #ff00ff !important;
      border-radius: 25px !important;
      background-color: #00ffff !important;
      color: #ff0000 !important;
      font-size: 1.4rem;
      transform: rotate(2deg);
      box-shadow: inset 10px 10px #ff1493;
    }

    .form-select:focus {
      transform: rotate(-7deg) scale(1.05);
      background-color: #ff6600 !important;
      color: #00ff00 !important;
    }

    .alert {
      margin: 50px -20px;
      padding: 30px;
      border: 12px groove #0000ff !important;
      border-radius: 50% !important;
      background: #ff0000 !important;
      color: #00ff00 !important;
      transform: rotate(5deg);
    }

    .list-group {
      gap: 17px;
    }

    .list-group-item {
      min-height: 75px;
      display: flex !important;
      align-items: center;
      background: #ff1493 !important;
      color: #0000ff !important;
      border: 8px dashed #00ff00 !important;
      border-radius: 0 !important;
      transform: rotate(-2deg);
      transition: all .15s;
    }

    .list-group-item:nth-child(2) {
      transform: rotate(4deg);
      margin-left: 25px;
    }

    .list-group-item:nth-child(3) {
      transform: rotate(-5deg);
      margin-right: 30px;
    }

    .list-group-item:nth-child(4) {
      transform: rotate(7deg);
      margin-left: 40px;
    }

    .list-group-item:nth-child(5) {
      transform: rotate(-8deg);
    }

    .list-group-item:hover {
      transform: translateX(100px) rotate(20deg) scale(1.2);
      background: #00ffff !important;
    }

    .btn {
      border-radius: 0 !important;
      border-width: 10px !important;
      font-family: "Comic Sans MS", cursive;
      font-weight: bold;
      transition: none !important;
    }

    .btn-primary {
      background: #0000ff !important;
      border-color: #ff0000 !important;
      color: #ffff00 !important;
    }

    .btn-danger {
      background: #00ff00 !important;
      border-color: #800080 !important;
      color: #ff00ff !important;
    }

    .btn-warning {
      background: #ff6600 !important;
      border-color: #0000ff !important;
      color: #00ff00 !important;
    }

    .btn:hover {
      padding-left: 80px;
      padding-right: 80px;
      transform: rotate(15deg);
    }

    .card-footer {
      border-top: 15px ridge #ff00ff !important;
      padding: 30px !important;
    }

    .footer {
      margin-top: 150px;
      margin-bottom: 300px;
      background: #000 !important;
      border: 20px ridge #00ff00;
      color: #ff00ff;
      transform: rotate(-2deg);
    }

    .footer .row > div {
      margin-bottom: 30px;
    }

    .footer .p-3 {
      border: 10px dotted #0000ff;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1100px !important;
    }

    @media (max-width: 768px) {
      .hero {
        margin-bottom: 80px !important;
      }

      .hero h1 {
        letter-spacing: -4px;
      }

      .card {
        margin-bottom: 70px;
      }

      .nav-link {
        margin: 3px;
      }
    }
  </style>
</head>

</html>
